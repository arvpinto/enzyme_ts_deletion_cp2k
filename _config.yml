title: Tutorial for the calculation of per-residue contributions to the energy barrier in CP2K
description: Measure how each residue changes the activation energy of an enzymatic reaction by deleting it from the reactant and transition state structures and repeating the QM/MM single points in CP2K.
author: Alexandre V. Pinto
lang: en
image: /assets/img/TS_DEL_RESIDUES.png

# Shown at the top of the main page of the tutorial. "hero" is the image next to the title
# (the original is assets/img/TS_DEL_RESIDUES.png).
topic: QM/MM
topic_color: "#ff5257"
series: Part 4 of Enzyme QM/MM with CP2K
tools: [CP2K, VMD, PyMOL, cpptraj, parmed]
hero:
  src: /assets/img/TS_DEL_RESIDUES.webp
  width: 614
  height: 489
  alt: Enzyme surface with acidic residues in red and basic residues in blue around the active site
